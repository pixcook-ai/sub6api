name: Deploy Sub6API

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sub6api-production
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/backend-ci.yml
  security:
    uses: ./.github/workflows/security-scan.yml
  package:
    needs: [checks, security]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build embedded frontend and Linux binary
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend run build
          bash scripts/release/package-deployment.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sub6api-${{ github.sha }}
          path: dist/deployment/
          if-no-files-found: error
          retention-days: 14
  deploy:
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: sub6api-production
      url: https://pixcook.ai
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: sub6api-${{ github.sha }}
          path: dist/deployment
      - name: Configure scoped SSH access
        env:
          DEPLOY_KEY: ${{ secrets.SUB6API_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SUB6API_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/sub6api
          chmod 600 ~/.ssh/sub6api
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Verify and upload immutable release
        env:
          DEPLOY_HOST: ${{ vars.SUB6API_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.SUB6API_DEPLOY_USER }}
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          (cd dist/deployment && sha256sum -c SHA256SUMS)
          tar -cf - -C dist/deployment sub2api deploy.sh COMMIT MIGRATIONS_SHA256 RUNTIME_SHA256 resources.tar.gz SHA256SUMS | ssh -i ~/.ssh/sub6api -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "upload $GITHUB_SHA"
          ssh -i ~/.ssh/sub6api -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA"
      - name: Verify public HTTPS
        run: |
          curl --fail --silent --show-error --retry 3 https://pixcook.ai/health | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ok"'
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/sub6api
